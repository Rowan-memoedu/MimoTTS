[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fy-mimo-tts"
version = "0.1.0"
description = "MiMo TTS CLI, streaming client and isolated comparison adapters"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mimo-tts = "mimo_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
